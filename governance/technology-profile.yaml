profile:
  id: assda-2454-tramitacion
  version: 1.0.0
  status: DRAFT
  description: Baseline technology profile for the online procedure 2454 web application, established from the work order and public-administration constraints.

backend:
  language: Java
  languageVersion: "21"
  framework: Spring Boot
  frameworkVersion: "3.3.x"
  buildTool: Maven
  architectureStyle: Modular monolith

frontend:
  language: TypeScript
  framework: React
  frameworkVersion: "19.x"
  buildTool: Vite

data:
  primaryDatabase:
    engine: PostgreSQL
    version: "16.x"
  migrationTool: Flyway

api:
  style: REST
  specification: OpenAPI
  specificationVersion: "3.1"

testing:
  backend:
    unitFramework: JUnit 5
    integrationFramework: Testcontainers
  frontend:
    unitFramework: Vitest
    e2eFramework: Playwright

deployment:
  containerisation: Docker
  orchestration: Docker Compose
  targetPlatform: "Junta de Andalucía accredited hosting / cloud aligned with ENS-ENI, pending confirmation of the final environment"

observability:
  logging: "Structured application logs with centralized collection"
  metrics: "Prometheus-compatible metrics and dashboards"
  tracing: "OpenTelemetry tracing"

security:
  standards:
    - ENS
    - ENI
    - RGPD
    - Ley 39/2015
    - Ley 39/2006
  authentication:
    - Cl@ve
    - Certificado digital
    - Firma electrónica

accessibility:
  standard: WCAG 2.1 AA
  legalReference: "RD 1112/2018 and applicable public-service accessibility requirements"
